# 法条级程序期限节点目录（Procedural Deadline Node Catalog）
#
# 用途：把"覆盖"从 18 条行为闸门（rules/gates.yaml）扩展为**法条级的程序期限节点**。
# 用途的由来：18 条行为闸门不足以支撑"覆盖"，还漏了上诉期、再审 6 个月、
# 执行异议 15 日、申请执行 2 年、除斥期间、保全续封、破产债权申报期等。
# 本目录逐条登记这些程序期限节点，精确到条。
#
# 与 rules/gates.yaml 的关系（两类规则、两个维度，不要混）：
#   * gates.yaml   —— 行为闸门（hook 时机 × enforcement 力度），管"某动作该不该做"。
#   * 本目录       —— 程序期限节点（触发 × 法定期间 × 失权后果），管"什么时候之前必须做/不能做"。
# 二者互补：18 条闸门里只有 gate.statute-of-limitations 沾到期限，且它把
# "诉讼时效"与"上诉期/不变期间"混为一谈（期间性质判定上的经典错误）。本目录把期限
# 节点独立出来、按**期间性质**分层，正是为了修这个硬伤。
#
# ⚠ 判定口径的要害："可逆/不可逆"必须按期间性质区分，不能一律算失权：
#   * 诉讼时效（民法典 188 条，3 年）——可中止/中断/延长，采**抗辩权发生说**：
#     时效届满债权不消灭，只使债务人取得抗辩权，且法院不得主动适用。
#     ⇒ **可逆**（不入 T_irr）。这是"看着像期限其实可逆"的典型，别误判为不可逆。
#   * 除斥期间（民法典 152/541/692 条）——不发生中止/中断/延长，届满**权利消灭**。
#     ⇒ **不可逆**（真正不可逆）。
#   * 不变期间（上诉期、申请再审 6 个月、执行异议之诉 15 日、支付令异议 15 日）——
#     仅可因不可抗力等**顺延**（民诉法 86 条），不适用中止/中断，届满失权。
#     ⇒ **不可逆**（失权型，跨入"剩余可救济度"更低层级）。
#   * 期间性质特别者单独标注：申请执行 2 年（民诉法 250 条）虽是"期限"，但明定
#     "适用诉讼时效中止、中断的规定"，故**可逆**（类时效），不得与不变期间混同。
#
# 每条节点登记字段：
#   id / stage / name / trigger(触发条件) / legal_basis(法律依据，精确到条)
#   / deadline(期限与起算) / consequence(法律后果) / period_type(期间性质)
#   / irreversibility{is_irreversible, kind, level_change, reason}
#   / verification{status, source}
#   - period_type：诉讼时效 | 除斥期间 | 不变期间 | 失权期限 | 指定期间
#   - kind：active(作为型) | passive(不作为型) | none(非不可逆)
#   - is_irreversible：是否构成 T_irr（按剩余可救济度分层；true=跨层级不可回退）
#   - verification.status：verified(已核对) | 待核(条号/原文待法条库复核)
#
# ⚠ 法条核对来源与限度（诚实声明）：本次撰写时北大法宝法规检索 MCP 全部端点
#   鉴权失败（"Unclassified Authentication Failure / checking remaining points"），
#   无法逐条调取原文。已核对项改以**网络权威全文**（现行有效的《民事诉讼法》
#   2023 修正全文等）比对确认；凡条号存在版本沿革差异、或未能核到原文的，
#   一律 verification.status: 待核，**不混入已核实条目**，待北大法宝可用后统一复核。
#   例：《民事诉讼法》2023 修正后条号较 2021 版后移（申请执行 2 年由 246 条→250 条），
#   执行异议/督促/公示催告各章条号不同来源不一致，故这些条号标"待核"。

version: 1
catalogue: 法条级程序期限节点目录
derived_from:
  coverage_purpose: 期限节点覆盖与期间性质区分（诉讼时效 vs 除斥期间/不变期间）
  level_semantics: 制度可救济度层级（剩余救济手段的多少 / 已承受制度性不利的轻重）
  period_type_semantics:
    诉讼时效: 可中止/中断/延长，抗辩权发生说，届满仅生抗辩权、债权不消灭 → 可逆
    除斥期间: 不可中止/中断/延长，届满权利消灭 → 不可逆
    不变期间: 仅可顺延（不可抗力），不中止/中断，届满失权 → 不可逆
    失权期限: 届满丧失特定程序权，部分可顺延/扣除 → 多数不可逆（按条标注）
    指定期间: 法院指定，可申请延长 → 多数可逆
  stage_values: [立案, 审前, 审理, 裁判, 执行, 特别程序, 实体救济]

nodes:

  # ═══════════════ 立案阶段（行政救济前置 / 起诉期限）═══════════════
  - id: dl.admin.reconsideration-60d
    stage: 立案
    name: 行政复议申请期限（60 日）
    trigger: 当事人知道或者应当知道行政行为侵犯其合法权益之日起
    legal_basis:
      - statute: 中华人民共和国行政复议法
        article: 第二十条（2023 修订前为第九条）
        text: 公民、法人或者其他组织认为行政行为侵犯其合法权益的，可以自知道或者应当知道该行政行为之日起六十日内提出行政复议申请；但是法律规定的申请期限超过六十日的除外。因不可抗力或者其他正当理由耽误法定申请期限的，申请期限自障碍消除之日起继续计算。
    deadline: 60 日（自知道或应当知道行政行为之日起；法律规定超过 60 日的从其规定）
    consequence: 逾期未申请复议的，丧失行政复议申请权（复议机关不予受理），只能在法定起诉期限内直接起诉或转为其他救济。
    period_type: 失权期限
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 复议通道开放 → 关闭（只能另行起诉/申诉）
      reason: >
        60 日为申请复议的失权期限，届满即丧失复议这一前置/可选救济通道，
        且该期限不适用中止、中断（仅因不可抗力等"继续计算"扣除障碍期），
        属"不作为跨层级不可逆恶化"。但注意：它**不是诉讼时效**（无中断），
        也非典型除斥期间（可因障碍"继续计算"），故单列"失权期限"，判定为不可逆但注明顺延例外。
    verification:
      status: 待核
      source: MCP(北大法宝)不可用；条号 2023 修订后与旧法不同，须复核；60 日期限本身确定

  - id: dl.admin.suit-limit-6m
    stage: 立案
    name: 行政起诉期限（6 个月；最长保护期 5 年/20 年）
    trigger: 自知道或者应当知道作出行政行为之日起（经复议的，收到复议决定书之日起 15 日内）
    legal_basis:
      - statute: 中华人民共和国行政诉讼法
        article: 第四十六条
        text: 公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。因不动产提起诉讼的案件自行政行为作出之日起超过二十年，其他案件自行政行为作出之日起超过五年提起诉讼的，人民法院不予受理。
    deadline: 6 个月（经复议的 15 日内起诉）；最长保护期：不动产 20 年 / 其他 5 年
    consequence: 逾期起诉的，人民法院裁定不予受理/驳回起诉；丧失行政诉权。
    period_type: 失权期限
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 可诉 → 不可诉（不予受理）
      reason: >
        起诉期限届满丧失行政诉权，法院不予受理，属不可逆失权。但因不可抗力或
        不属于自身原因耽误的期间**不计算在内**（可扣除），故非纯除斥期间；
        6 个月为失权期限（不可逆），20 年/5 年最长保护期为除斥性质（绝对不可逆）。
        与民事诉讼时效不同：行政起诉期限是**失权期限**，不采抗辩权发生说，法院应依职权审查。
    verification:
      status: 待核
      source: MCP不可用；6 个月/20 年/5 年的期限结构确定，条号待复核

  # ═══════════════ 审前阶段（答辩 / 管辖异议 / 举证）═══════════════
  - id: dl.civil.defense-15d
    stage: 审前
    name: 答辩期限（15 日）
    trigger: 被告收到起诉状副本之日起
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第一百二十八条
        text: 人民法院应当在立案之日起五日内将起诉状副本发送被告，被告应当在收到之日起十五日内提出答辩状。……被告不提出答辩状的，不影响人民法院审理。
    deadline: 15 日（自收到起诉状副本之日起）
    consequence: 被告不提出答辩状的，不影响人民法院审理（法院照常审理、可缺席/当庭答辩）。
    period_type: 指定期间
    irreversibility:
      is_irreversible: false
      kind: none
      level_change: 层级不变（不答辩不导致失权）
      reason: >
        **这是"看着像期限其实可逆"的典型**：答辩期届满不答辩，法院仍照常审理
        （民诉法 128 条明定"不影响审理"），当事人还可当庭/庭后补充答辩，无失权后果，
        层级不变 ⇒ 可逆，不入 T_irr。真正不可逆的是**管辖异议**须在答辩期内提出
        （见 dl.civil.jurisdiction-objection），二者别混：答辩期本身可逆。
    verification:
      status: verified
      source: MCP不可用，经《民事诉讼法》(2023 修正)现行全文核对（第128条）

  - id: dl.civil.jurisdiction-objection
    stage: 审前
    name: 管辖权异议期限（答辩期内）
    trigger: 人民法院受理案件后，当事人对管辖权有异议的，应当在提交答辩状期间提出
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第一百三十条
        text: 人民法院受理案件后，当事人对管辖权有异议的，应当在提交答辩状期间提出。……当事人未提出管辖异议，并应诉答辩或者提出反诉的，视为受诉人民法院有管辖权，但违反级别管辖和专属管辖规定的除外。
    deadline: 提交答辩状期间内（即 15 日答辩期内）
    consequence: 逾期未提管辖异议并应诉答辩/反诉的，视为受诉法院有管辖权（级别/专属管辖除外），不得再异议。
    period_type: 失权期限
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 管辖可争 → 视为确定（丧失管辖异议权）
      reason: >
        应诉答辩且未提管辖异议即"视为有管辖权"，该拟制效果不可回转，
        属"不作为（未在答辩期异议）跨层级不可逆恶化"。注意与答辩期本身区分：
        答辩可逆，**管辖异议期不可逆**（本条）。
    verification:
      status: verified
      source: MCP不可用，经《民事诉讼法》(2023 修正)现行全文核对（第130条）

  - id: dl.civil.evidence-period
    stage: 审理
    name: 举证期限（一审普通程序不少于 15 日）
    trigger: 人民法院根据案件情况指定举证期限（一审普通程序不得少于 15 日，二审不少于 10 日）
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第六十八条
        text: 当事人对自己提出的主张应当及时提供证据。人民法院根据当事人的主张和案件审理情况，确定当事人应当提供的证据及其期限。当事人在该期限内提供证据确有困难的，可以向人民法院申请延长期限……当事人逾期提供证据的，人民法院应当责令其说明理由；拒不说明理由或者理由不成立的，人民法院根据不同情形可以不予采纳该证据，或者采纳该证据但予以训诫、罚款。
      - statute: 最高人民法院关于民事诉讼证据的若干规定 / 民诉法解释
        article: 第五十一条（一审普通程序举证期限不得少于十五日）
        text: 一审普通程序举证期限不得少于十五日，二审不得少于十日（具体条号见待核）。
    deadline: 法院指定（一审普通程序≥15 日）；确有困难可申请延长
    consequence: 逾期举证的，法院责令说明理由；拒不说明或理由不成立的，可不予采纳，或采纳后训诫、罚款。
    period_type: 指定期间
    irreversibility:
      is_irreversible: false
      kind: none
      level_change: 层级基本不变（逾期非当然失权）
      reason: >
        举证期限为**指定期间**，可申请延长（民诉法 68 条）；逾期举证也非当然失权，
        而是"视情形不予采纳或采纳后训诫/罚款"——是裁量后果，非绝对失权，
        且可通过补正/延长回补，层级不发生不可逆跃迁 ⇒ 可逆，不入 T_irr。
        （对比：一审判决上诉期是不变期间，逾期绝对失权，那才是不可逆。）
    verification:
      status: 待核
      source: MCP不可用；民诉法第68条已核（现行全文），"≥15日"来自司法解释、条号待核

  # ═══════════════ 裁判阶段（上诉 / 再审）═══════════════
  - id: dl.civil.appeal-15d
    stage: 裁判
    name: 民事上诉期限（判决 15 日 / 裁定 10 日）
    trigger: 当事人不服地方人民法院第一审判决/裁定，自判决书/裁定书送达之日起
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第一百七十一条
        text: 当事人不服地方人民法院第一审判决的，有权在判决书送达之日起十五日内向上一级人民法院提起上诉。当事人不服地方人民法院第一审裁定的，有权在裁定书送达之日起十日内向上一级人民法院提起上诉。
    deadline: 判决 15 日 / 裁定 10 日（自送达之日起）
    consequence: 逾期不上诉的，第一审判决/裁定发生法律效力，丧失上诉救济。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 一审未生效、可上诉 → 生效、落入再审（更难救济层级）
      reason: >
        上诉期为**不变期间**，仅可因不可抗力等顺延（民诉法 86 条），不适用中止/中断；
        届满不上诉即失上诉权、一审裁判生效，剩余可救济度骤降（只能走再审这一更高门槛）。
        属典型"不作为跨层级不可逆恶化"，是 `T_irr` 的核心节点。
    verification:
      status: verified
      source: MCP不可用，经《民事诉讼法》(2023 修正)现行全文核对（第171条）

  - id: dl.admin.appeal-15d
    stage: 裁判
    name: 行政诉讼上诉期限（判决 15 日 / 裁定 10 日）
    trigger: 当事人不服人民法院第一审行政判决/裁定，自送达之日起
    legal_basis:
      - statute: 中华人民共和国行政诉讼法
        article: 第八十五条
        text: 当事人不服人民法院第一审判决的，有权在判决书送达之日起十五日内向上一级人民法院提起上诉。当事人不服人民法院第一审裁定的，有权在裁定书送达之日起十日内向上一级人民法院提起上诉。逾期不提起上诉的，人民法院的第一审判决或者裁定发生法律效力。
    deadline: 判决 15 日 / 裁定 10 日
    consequence: 逾期不上诉的，第一审判决/裁定发生法律效力。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 一审未生效 → 生效（失上诉权）
      reason: 与民事上诉期同构：不变期间，届满失上诉权、一审生效，不可逆。
    verification:
      status: 待核
      source: MCP不可用；15/10 日期限结构确定，条号待复核

  - id: dl.civil.retrial-6m
    stage: 裁判
    name: 民事申请再审期限（6 个月）
    trigger: 判决、裁定发生法律效力后（有法定再审事由的，自知道或应当知道之日起 6 个月）
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第二百一十六条
        text: 当事人申请再审，应当在判决、裁定发生法律效力后六个月内提出；有本法第二百一十一条第一项、第三项、第十二项、第十三项规定情形的，自知道或者应当知道之日起六个月内提出。
    deadline: 6 个月（自裁判生效之日起；特定事由自知道或应当知道之日起）
    consequence: 逾期申请再审的，人民法院不予受理（丧失申请再审权）。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 可申请再审 → 不予受理（救济通道进一步收窄）
      reason: >
        申请再审 6 个月为**不变期间**（司法实践作除斥性质把握，不中止/中断），
        届满即失再审申请权，剩余可救济度进一步下降 ⇒ 不可逆。
    verification:
      status: verified
      source: MCP不可用，经《民事诉讼法》(2023 修正)现行全文核对（第216条）

  - id: dl.admin.retrial-6m
    stage: 裁判
    name: 行政诉讼申请再审期限（6 个月）
    trigger: 行政判决、裁定发生法律效力后
    legal_basis:
      - statute: 中华人民共和国行政诉讼法
        article: 第九十条
        text: 当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行；申请再审应当在判决、裁定发生法律效力后六个月内提出。
    deadline: 6 个月
    consequence: 逾期申请再审的，不予受理。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 可申请再审 → 不予受理
      reason: 同民事再审：不变期间届满失再审申请权，不可逆。
    verification:
      status: 待核
      source: MCP不可用；6 个月确定，条号待复核

  # ═══════════════ 执行阶段（申请执行 / 执行异议 / 执行异议之诉 / 保全续封）═══════════════
  - id: dl.enf.apply-2y
    stage: 执行
    name: 申请执行期间（2 年）
    trigger: 法律文书规定履行期间的最后一日起（分期履行的，自最后一期履行期限届满之日起）
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第二百五十条
        text: 申请执行的期间为二年。申请执行时效的中止、中断，适用法律有关诉讼时效中止、中断的规定。……
    deadline: 2 年（自履行期间最后一日起；适用时效中止/中断规定）
    consequence: 逾期申请执行的，人民法院不予受理，丧失强制执行请求权（债权本身不消灭，但不能请求法院强制实现）。
    period_type: 诉讼时效
    irreversibility:
      is_irreversible: false
      kind: none
      level_change: 层级不发生不可逆跃迁（可中止/中断重算）
      reason: >
        **关键区分点**：申请执行 2 年虽名为"期间"，但民诉法 250 条明定
        "申请执行时效的中止、中断，适用法律有关诉讼时效中止、中断的规定"——
        即它是**类诉讼时效**，可中止/中断/重算，届满仅生"不予受理"的抗辩效果，
        且债权人主张权利、债务人同意履行即可中断 ⇒ **可逆**，不得与不变期间混同。
        早期 gate.statute-of-limitations 把它与上诉期一并当"不可逆期限"，属期间性质判定上的错误。
    verification:
      status: verified
      source: MCP不可用，经《民事诉讼法》(2023 修正)现行全文核对（第250条；民诉法解释第466条援引旧序号246条）

  - id: dl.enf.act-objection-15d
    stage: 执行
    name: 执行行为异议（15 日审查 / 不服 10 日内复议）
    trigger: 当事人、利害关系人认为执行行为违反法律规定，向负责执行的法院提出书面异议；不服裁定的
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第二百三十二条（不同版本作第二百三十六条，条号待核）
        text: 当事人、利害关系人认为执行行为违反法律规定的，可以向负责执行的人民法院提出书面异议。……人民法院应当自收到书面异议之日起十五日内审查……当事人、利害关系人对裁定不服的，可以自裁定送达之日起十日内向上一级人民法院申请复议。
      - statute: 最高人民法院关于人民法院办理执行异议和复议案件若干问题的规定
        article: 法释〔2015〕10 号
        text: 执行法院审查执行异议，应当自收到书面异议之日起十五日内作出裁定。
    deadline: 异议：执行程序中提出；不服裁定 10 日内申请复议（法院审查期 15 日）
    consequence: 逾期不复议的，执行异议裁定生效，执行行为确定，不得再就同一执行行为争执。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 执行行为可争 → 裁定生效、执行行为确定（失复议救济）
      reason: >
        不服执行异议裁定的 10 日复议期为**不变期间**，届满失复议权、裁定生效，
        属"不作为跨层级不可逆恶化"。注意：法院"15 日审查"是**法院**的办案期限，
        非当事人期限；当事人的不可逆节点是 10 日复议期。
    verification:
      status: 待核
      source: MCP不可用；15 日审查/10 日复议的结构确定，民诉法条号有版本差异（232/236）待核

  - id: dl.enf.outsider-lawsuit-15d
    stage: 执行
    name: 案外人异议 + 执行异议之诉（15 日起诉期）
    trigger: 案外人对执行标的提出书面异议，法院 15 日内裁定；案外人、当事人不服裁定（与原判决、裁定无关的）
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第二百三十四条（不同版本作第二百三十八条，条号待核）
        text: 执行过程中，案外人对执行标的提出书面异议的，人民法院应当自收到书面异议之日起十五日内审查……案外人、当事人对裁定不服，认为原判决、裁定错误的，依照审判监督程序办理；与原判决、裁定无关的，可以自裁定送达之日起十五日内向人民法院提起诉讼。
    deadline: 法院 15 日内审查异议；不服裁定且与原裁判无关的，15 日内提起执行异议之诉
    consequence: 逾期不提执行异议之诉的，异议裁定生效，执行标的被处分/交付，案外人失实体救济。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 执行标的可保 → 被执行处分、失实体救济（标的物不可回转）
      reason: >
        执行异议之诉 15 日起诉期为**不变期间**，届满不诉即失诉权、执行标的被执行处分，
        标的物层面不可回转（如房产已过户）⇒ 不可逆，属"不作为跨层级不可逆恶化"。
        属`T_irr` 的核心节点。
    verification:
      status: 待核
      source: MCP不可用；15 日结构确定，民诉法条号有版本差异（234/238）待核

  - id: dl.enf.preservation-renewal
    stage: 执行
    name: 保全续封 / 诉前保全 30 日内起诉
    trigger: 诉前保全后 30 日内未依法起诉/仲裁；或查封、扣押、冻结期限届满前未申请续行
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第一百零四条（诉前保全 30 日）
        text: 申请人在人民法院采取保全措施后三十日内不依法提起诉讼或者申请仲裁的，人民法院应当解除保全。
      - statute: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
        article: 第四百八十七条（查封/扣押/冻结期限：存款 1 年、动产 2 年、不动产 3 年；续行须届满前办理，条号待核）
        text: 人民法院冻结被执行人的银行存款的期限不得超过一年，查封、扣押动产的期限不得超过二年，查封不动产、冻结其他财产权的期限不得超过三年。申请执行人申请延长期限的，人民法院应当在查封、扣押、冻结期限届满前办理续行手续。
    deadline: 诉前保全后 30 日内起诉/续封；冻结/查封期限（存款 1 年/动产 2 年/不动产 3 年）届满前续行
    consequence: 逾期未续封的，查封/扣押/冻结效力消灭、保全自动解除，财产可被转移、处分；诉前保全 30 日不起诉的，解除保全。
    period_type: 失权期限
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 财产受控 → 保全失效、财产失控/灭失（胜诉亦难获清偿）
      reason: >
        保全续封是典型"不作为致不可逆"：不续封→保全自动失效→财产被转移/处分，
        事后即使胜诉也无从实现，标的物层面不可回转 ⇒ 不可逆（与 gate.suspension-of-execution
        "标的物灭失"同型）。
    verification:
      status: 待核
      source: MCP不可用；30 日与冻结/查封期限结构确定（民诉法104条已核），续封条号待核

  # ═══════════════ 特别程序（督促 / 公示催告 / 破产）═══════════════
  - id: dl.civil.payment-order-15d
    stage: 特别程序
    name: 支付令异议期限（15 日）
    trigger: 债务人收到支付令之日起
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 第二百一十七条（督促程序，2023 修正条号待核）
        text: 人民法院受理申请后，经审查债权人提供的事实、证据，对债权债务关系明确、合法的，应当在受理之日起十五日内向债务人发出支付令；申请不成立的，裁定予以驳回。债务人应当自收到支付令之日起十五日内清偿债务，或者向人民法院提出书面异议。……债务人在前款规定的期间不提出异议又不履行支付令的，债权人可以向人民法院申请执行。
    deadline: 15 日（自收到支付令之日起清偿或提书面异议）
    consequence: 逾期不异议又不履行的，支付令生效、可申请强制执行；提出书面异议的，督促程序终结、支付令失效（转入诉讼）。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 支付令未生效 → 生效可强制执行（失异议抗辩）
      reason: >
        15 日异议期为**不变期间**，届满不异议即支付令生效、转入强制执行，
        丧失以异议阻止支付令生效的机会 ⇒ 不可逆。
    verification:
      status: 待核
      source: MCP不可用；15 日确定，督促程序条号有版本差异待核

  - id: dl.civil.public-notice-60d
    stage: 特别程序
    name: 公示催告（公告期不少于 60 日）
    trigger: 法院受理公示催告申请后，发出公告催促利害关系人申报权利
    legal_basis:
      - statute: 中华人民共和国民事诉讼法
        article: 公示催告程序（第二百二十六条以下，2023 修正条号待核）
        text: 人民法院决定受理申请，应当同时通知支付人停止支付，并在三日内发出公告，催促利害关系人申报权利。公示催告的期间，由人民法院根据情况决定，但不得少于六十日。
      - statute: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
        article: 第四百四十九条
        text: 公告期间不得少于六十日，且公示催告期间届满日不得早于票据付款日后十五日。
    deadline: ≥60 日（公告期；届满日不得早于票据付款日后 15 日）
    consequence: 公告期满无人申报权利的，法院判决宣告票据/事项无效（申请人取得权利）；利害关系人逾期未申报的，丧失票据/实体权利（除权判决后只能另诉）。
    period_type: 不变期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 票据/权利待定 → 除权判决、真权利人失权（申报期失权）
      reason: >
        对**利害关系人**（真权利人）而言，公告期是申报权利的**不变期间**，
        不申报即失权、票据被除权判决宣告无效，事后只能另行起诉且举证困难 ⇒ 不可逆
        （不作为型）。（对申请人则是作为型的取权动作。）
    verification:
      status: 待核
      source: 民诉法解释第449条"≥60日"已核；民诉法公示催告章条号待核

  - id: dl.bankruptcy.claim-declaration
    stage: 特别程序
    name: 破产债权申报期限（30 日 ~ 3 个月）
    trigger: 人民法院受理破产申请后发布公告之日起
    legal_basis:
      - statute: 中华人民共和国企业破产法
        article: 第四十五条
        text: 人民法院受理破产申请后，应当确定债权人申报债权的期限。债权申报期限自人民法院发布受理破产申请公告之日起计算，最短不得少于三十日，最长不得超过三个月。
      - statute: 中华人民共和国企业破产法
        article: 第五十六条（逾期申报的后果）
        text: 在人民法院确定的债权申报期限内，债权人未申报债权的，可以在破产财产最后分配前补充申报；但是，此前已进行的分配，不再对其补充分配。为审查和确认补充申报债权的费用，由补充申报人承担。
    deadline: 30 日 ~ 3 个月（自受理破产申请公告之日起）
    consequence: 逾期申报的，可在破产财产最后分配前补充申报，但此前已分配部分不再补充分配，且审查费用自担；未申报的，丧失债权人会议表决权等程序权。
    period_type: 失权期限
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 债权可全额参与分配 → 丧失表决权、已分配部分不可补（部分失权）
      reason: >
        **部分不可逆**：逾期申报虽可补充，但①此前已分配的不再补（财产利益不可回转）；
        ②丧失债权人会议表决权（程序地位不可回转）；③审查费用自担。
        故对"已分配份额"与"表决权"而言是不可逆失权，属不作为型；
        对"剩余可分配份额"仍可补申报。判定为不可逆并注明其为**部分失权**。
        在「已分配份额」与「表决权」两项上构成不可逆失权。
    verification:
      status: 待核
      source: MCP不可用；30 日~3 个月及逾期补充申报的后果结构确定，条号待核

  # ═══════════════ 实体救济 / 除斥期间（期间性质区分的核心）═════════════
  - id: dl.civil.rescission-90d-1y-5y
    stage: 实体救济
    name: 撤销权除斥期间（重大误解 90 日 / 胁迫 1 年 / 最长 5 年）
    trigger: 当事人知道或者应当知道撤销事由之日起（重大误解 90 日、受胁迫 1 年）；自民事法律行为发生之日起最长 5 年
    legal_basis:
      - statute: 中华人民共和国民法典
        article: 第一百五十二条
        text: 有下列情形之一的，撤销权消灭：（一）当事人自知道或者应当知道撤销事由之日起一年内、重大误解的当事人自知道或者应当知道撤销事由之日起九十日内没有行使撤销权；（二）当事人受胁迫，自胁迫行为终止之日起一年内没有行使撤销权；（三）当事人知道撤销事由后明确表示或者以自己的行为表明放弃撤销权。当事人自民事法律行为发生之日起五年内没有行使撤销权的，撤销权消灭。
    deadline: 重大误解 90 日 / 胁迫 1 年（自知道或应知撤销事由或胁迫终止之日起）；最长 5 年（自行为发生之日起）
    consequence: 除斥期间届满撤销权消灭，不得再请求撤销该民事法律行为。
    period_type: 除斥期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 撤销权存续 → 消灭（法律行为确定有效）
      reason: >
        **典型除斥期间**：不发生中止、中断、延长，届满**权利消灭**
        （非仅生抗辩权），且法院可依职权审查 ⇒ 真正不可逆。与诉讼时效（188 条）
        的"抗辩权发生说、可中断"形成对照，绝不可混为一谈。
    verification:
      status: 待核
      source: MCP不可用；90日/1年/5年的除斥结构确定，条号待复核

  - id: dl.civil.creditor-rescission-1y-5y
    stage: 实体救济
    name: 债权人撤销权除斥期间（1 年 / 5 年）
    trigger: 债权人知道或者应当知道撤销事由之日起 1 年；自债务人的行为发生之日起 5 年
    legal_basis:
      - statute: 中华人民共和国民法典
        article: 第五百四十一条
        text: 撤销权自债权人知道或者应当知道撤销事由之日起一年内行使。自债务人的行为发生之日起五年内没有行使撤销权的，该撤销权消灭。
    deadline: 1 年（自知道或应知撤销事由之日起）/ 5 年（自债务人行为发生之日起）
    consequence: 除斥期间届满债权人撤销权消灭，不得再请求撤销债务人处分财产的行为。
    period_type: 除斥期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 债权人撤销权存续 → 消灭（债务人处分行为确定有效）
      reason: >
        除斥期间，不可中止/中断/延长，届满撤销权消灭 ⇒ 真正不可逆（对照诉讼时效可中断）。
    verification:
      status: verified
      source: MCP不可用，经网络权威来源核对（民法典第541条原文）

  - id: dl.civil.guarantee-period
    stage: 实体救济
    name: 保证期间（约定或主债务履行期届满之日起 6 个月）
    trigger: 主债务履行期限届满之日起（约定按约定；未约定为主债务履行期届满之日起 6 个月）
    legal_basis:
      - statute: 中华人民共和国民法典
        article: 第六百九十二条
        text: 保证期间是确定保证人承担保证责任的期间，不发生中止、中断和延长。债权人与保证人可以约定保证期间，但是约定的保证期间早于主债务履行期限届满日或者与主债务履行期限届满日同时届满的，视为没有约定；没有约定或者约定不明确的，保证期间为主债务履行期限届满之日起六个月。
    deadline: 约定或 6 个月（自主债务履行期届满之日起）
    consequence: 保证期间届满债权人未依法向保证人主张保证责任的，保证人不再承担保证责任（保证责任消灭）。
    period_type: 除斥期间
    irreversibility:
      is_irreversible: true
      kind: passive
      level_change: 保证责任存续 → 消灭（保证人免责）
      reason: >
        民法典 692 条明定保证期间"不发生中止、中断和延长"，届满保证责任消灭，
        是法定的**除斥期间**，真正不可逆（债权人不主张→保证人免责，不可回转）。
    verification:
      status: 待核
      source: MCP不可用；"不中止/中断/延长+6个月"的除斥性质确定，条号待复核

  - id: dl.civil.limitation-3y
    stage: 实体救济
    name: 普通诉讼时效（3 年）—— 对照项：可逆
    trigger: 权利人知道或者应当知道权利受到损害以及义务人之日起
    legal_basis:
      - statute: 中华人民共和国民法典
        article: 第一百八十八条
        text: 向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。……自权利受到损害之日起超过二十年的，人民法院不予保护，有特殊情况的，人民法院可以根据权利人的申请决定延长。
    deadline: 3 年（可中止/中断/延长；最长 20 年）
    consequence: 时效届满义务人取得抗辩权，权利人请求权不受强制保护，但**债权不消灭**；法院不得主动适用诉讼时效（抗辩权发生说）。
    period_type: 诉讼时效
    irreversibility:
      is_irreversible: false
      kind: none
      level_change: 层级不变（仅生抗辩权，可中断重算、债务人可自愿履行/重新确认）
      reason: >
        **对照组**：诉讼时效采**抗辩权发生说**，届满债权不消灭、仅生抗辩权，
        且可中止/中断/延长，债务人自愿履行或重新确认债务即可"复活"，法院不得主动适用。
        ⇒ **可逆**，不入 T_irr。它是"看着像失权期限其实可逆"的教科书例子，
        故必须与除斥期间/不变期间严格区分。把它误判为不可逆
        （如旧 gate.statute-of-limitations 那样）是期间性质判定上的错误。
    verification:
      status: verified
      source: MCP不可用，经网络权威来源核对（民法典第188条原文）

  - id: dl.state-compensation-2y
    stage: 实体救济
    name: 国家赔偿请求时效（2 年）
    trigger: 赔偿请求人知道或者应当知道国家机关及其工作人员行使职权时的行为侵犯其人身权、财产权之日起
    legal_basis:
      - statute: 中华人民共和国国家赔偿法
        article: 第三十九条
        text: 赔偿请求人请求国家赔偿的时效为二年，自其知道或者应当知道国家机关及其工作人员行使职权时的行为侵犯其人身权、财产权之日起计算，但被羁押等限制人身自由的时间不计算在内。……赔偿请求人在赔偿请求时效的最后六个月内，因不可抗力或者其他障碍不能行使请求权的，时效中止。
    deadline: 2 年（自知道或应知侵权之日起；被羁押等限制人身自由期不计入；最后 6 个月可中止）
    consequence: 时效届满赔偿请求权不受保护（赔偿义务机关可不予赔偿），但请求权不消灭、赔偿义务人自愿赔偿的不受此限。
    period_type: 诉讼时效
    irreversibility:
      is_irreversible: false
      kind: none
      level_change: 层级不变（时效可中止/扣除，仅生抗辩效果）
      reason: >
        国家赔偿请求时效 2 年**可中止**（最后 6 个月不可抗力/障碍）、且被羁押期
        **不计入**（扣除），属类诉讼时效而非不变/除斥期间 ⇒ **可逆**（对照项）。
        与除斥期间区分：它会中止、会扣除，届满仅生抗辩效果、非权利绝对消灭。
    verification:
      status: 待核
      source: MCP不可用；2 年+中止+羁押扣除的时效性质确定，条号待复核
